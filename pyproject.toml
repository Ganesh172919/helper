[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-the-helper"
version = "0.1.0"
description = "Local Python desktop assistant with reviewed screen context and bring-your-own-key AI"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "PyQt5==5.15.11", "httpx==0.28.1", "Pillow==12.3.0",
  "mss==10.2.0", "keyring==25.7.0", "python-dotenv==1.2.4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
maya-helper = "maya.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
